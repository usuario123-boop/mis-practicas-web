; Configuración de PHP para el despliegue en Vercel (vercel-php).
; Las extensiones mysqli, curl, fileinfo y openssl ya vienen incluidas.

; El tope real de subida lo fija MAX_PDF_BYTES en pract4/config.php (4 MB).
; Aquí se deja por encima para que mande la aplicación y no el intérprete.
upload_max_filesize = 8M
post_max_size       = 8M

memory_limit        = 256M
max_execution_time  = 30

date.timezone       = America/Mexico_City

; En producción los errores se registran, no se muestran al visitante.
display_errors      = Off
log_errors          = On
